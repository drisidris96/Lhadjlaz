kind = "web"
previewPath = "/"
title = "الحاج لاز - بيع الملابس بالجملة"
version = "1.0.0"
id = "artifacts/alhaj-laz"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24605

[services.development]
run = "pnpm --filter @workspace/alhaj-laz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alhaj-laz", "run", "build" ]
publicDir = "artifacts/alhaj-laz/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24605"
BASE_PATH = "/"
