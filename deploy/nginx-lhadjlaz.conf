# /etc/nginx/sites-available/lhadjlaz
# After saving, link it:
#   sudo ln -s /etc/nginx/sites-available/lhadjlaz /etc/nginx/sites-enabled/
# Then get SSL:
#   sudo certbot --nginx -d lhadjlaz.store -d www.lhadjlaz.store

server {
    listen 80;
    listen [::]:80;
    server_name lhadjlaz.store www.lhadjlaz.store lhadjlaz.publicvm.com;

    # Certbot will modify this block to add HTTPS automatically.

    client_max_body_size 12M;

    # Static frontend (built by Vite)
    root /var/www/lhadjlaz/artifacts/alhaj-laz/dist/public;
    index index.html;

    # API and storage proxied to Node (PM2)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # SPA fallback for frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
